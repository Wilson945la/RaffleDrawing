# ============================================================
# 生产环境 (prod) — 部署到服务器
# 激活方式: spring.profiles.active=prod
#         或启动参数: --spring.profiles.active=prod
# ============================================================
server.port=${SERVER_PORT:8080}

# -----------------------------------------------------------
# MySQL 数据库（生产环境使用）
# 请根据实际情况修改下面的连接信息
# 也可以通过环境变量覆盖：
#   DB_HOST=服务器IP
#   DB_PORT=3306
#   DB_NAME=raffle
#   DB_USER=root
#   DB_PASS=your_password
# -----------------------------------------------------------
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:raffle}?useUnicode=true&characterEncoding=utf-8&serverTimezone=Asia/Shanghai&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASS:your_password}

# 连接池（HikariCP — Spring Boot 默认，生产级连接池）
spring.datasource.hikari.maximum-pool-size=50
spring.datasource.hikari.minimum-idle=10
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=30000

# JPA — 首次部署用 update 自动建表，稳定后改为 none
# ddl-auto=update 安全：只新增表/列，不删除已有数据
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update

# 管理员账号：DataInitializer 启动时自动创建（如已存在则跳过）
app.admin.account-id=chfz-00000000
app.admin.name=\u7ba1\u7406\u5458

# 日志
logging.level.com.caohua.raffle=INFO
logging.file.name=logs/raffle.log
