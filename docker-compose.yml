# ============================================================
# 草花互动抽奖服务器 — 一键部署（含 MySQL）
# 启动: docker-compose up -d
# 停止: docker-compose down
# 查看日志: docker-compose logs -f
# ============================================================
version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: raffle-mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASS:-raffle2024!}
      MYSQL_DATABASE: RaffleDrawing
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"   # 映射到宿主机 3307 避免与已有 MySQL 冲突
    volumes:
      - mysql_data:/var/lib/mysql
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build: .
    container_name: raffle-server
    restart: always
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: prod
      DB_HOST: mysql
      DB_PORT: "3306"
      DB_NAME: RaffleDrawing
      DB_USER: root
      DB_PASS: ${DB_PASS:-raffle2024!}
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - ./logs:/app/logs

volumes:
  mysql_data:
